[project]
name = "rubick-backend"
version = "0.1.0"
description = "Local Python service for Rubick — multimodal embedding, indexing, search."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "BIGBALLON" }]

dependencies = [
    # Core embedding stack
    "mlx>=0.23",
    # Hugging Face's Rust tokenizer binding — used directly by the
    # text path. No transformers / torch / torchvision needed at
    # runtime: image and video preprocessing is hand-rolled in
    # ``embed/preprocessing.py`` (PIL + numpy only). The dev extras
    # below pull transformers in for the parity test suite.
    "tokenizers>=0.22",
    "huggingface_hub>=0.27",
    "pillow>=11",
    # iPhone photos default to HEIC; Pillow 12 still doesn't ship native
    # HEIF support so we register the opener via pillow-heif.
    "pillow-heif>=0.18",
    "av>=12",
    "numpy>=1.26",

    # Storage & retrieval
    "lancedb>=0.13",
    "pandas>=2.2",
    # Nebula M3 — 3-D semantic map + auto-clustering
    "umap-learn>=0.5",
    "hdbscan>=0.8",

    # HTTP server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2",
    # FastAPI's multipart parser; required for POST /search fused-query
    # multipart image uploads. Not a transitive dep of fastapi itself.
    "python-multipart>=0.0.20",

    # Utilities
    "psutil>=6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",            # FastAPI test client
    # transformers + torch are dev-only — used by
    # ``test_preprocessing_parity.py`` to compare our hand-rolled
    # numpy preprocessing against the canonical AutoProcessor output.
    "transformers>=4.57",
    "torch",
    "torchvision",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubick_backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
